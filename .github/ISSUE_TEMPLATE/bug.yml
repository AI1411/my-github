name: 🐛 Bug report
description: Report unexpected behavior in my-github
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce the issue in the Tauri desktop app.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem in plain language.
      placeholder: e.g. Opening a PR detail page shows a blank diff panel after switching accounts.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that consistently trigger the issue.
      placeholder: |
        1. Sign in with a PAT that has repo + notifications scopes
        2. Open Pulls → select a PR with failing CI
        3. Switch to the Checks tab
        4. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: e.g. Check runs should list with status icons and links to logs.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: e.g. The tab stays on a spinner indefinitely.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - Inbox / Activity
        - Pull requests
        - Issues
        - CI / workflow runs
        - Search / command palette
        - Settings / accounts
        - Sync / notifications
        - Rust backend (Tauri commands)
        - Frontend (React)
        - Other / unsure
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (app unusable or data loss)
        - High (major feature broken)
        - Medium (workaround exists)
        - Low (cosmetic / minor)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - my-github version: 0.1.0 (or commit SHA)
        - OS: macOS 15 / Windows 11 / Linux
        - GitHub host: github.com or GHES URL
        - PAT type: classic / fine-grained
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Tauri devtools console output, `RUST_LOG` lines, or screenshots help a lot.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
