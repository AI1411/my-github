name: ✨ Feature request
description: Suggest a new capability or improvement for my-github
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        my-github v0.1 is **view-only** — write actions open GitHub in the browser. Proposals that fit that scope are easiest to ship.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What workflow pain does this solve?
      placeholder: e.g. I review PRs across 20 repos and need to filter by failing CI without opening each PR on github.com.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the app do?
      placeholder: e.g. Add a "CI failing" filter chip on the Pulls list that uses cached check status.
    validations:
      required: true

  - type: dropdown
    id: user-type
    attributes:
      label: Primary user
      options:
        - Individual contributor
        - Team lead / reviewer
        - Maintainer across many repos
        - Multi-account (personal + work)
        - All users
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your view)
      options:
        - High (blocks daily use)
        - Medium (nice to have)
        - Low (future idea)
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Expected benefits
      placeholder: |
        - Faster triage of review requests
        - Fewer context switches to the browser
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: e.g. Use GitHub notifications only; use a third-party dashboard.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Filter persists per account
        - [ ] Works offline with cached data
        - [ ] Keyboard shortcut documented in Settings → Shortcuts
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: Mockups, links to similar tools, related issues.
    validations:
      required: false
