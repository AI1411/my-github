name: 🔧 Refactor / tech debt
description: Improve code quality without changing user-visible behavior
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for internal improvements in the Tauri (Rust) backend or React frontend.

  - type: textarea
    id: current-state
    attributes:
      label: Current pain
      placeholder: |
        e.g.
        - `src-tauri/src/commands/pulls.rs` mixes caching and GitHub fetch logic
        - Duplicate DTO mapping between Rust and TypeScript
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      placeholder: |
        e.g.
        - Extract a `PullCacheService` used by list + detail commands
        - Share Zod schemas via a single `shared/types` module
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Single file
        - Rust crate (`src-tauri`)
        - Frontend (`src/`)
        - Cross-cutting (IPC boundary)
        - Tooling / CI
    validations:
      required: true

  - type: dropdown
    id: refactor-type
    attributes:
      label: Refactor type
      options:
        - Structure / modularity
        - Performance
        - Testability
        - Naming / readability
        - Dependency cleanup
        - Error handling
        - Other
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Expected benefits
      placeholder: |
        - Easier to add new Tauri commands
        - Fewer stale-response bugs in React Query hooks
    validations:
      required: true

  - type: textarea
    id: affected-files
    attributes:
      label: Likely files
      placeholder: |
        - src-tauri/src/cache/pulls.rs
        - src/features/pulls/usePullsQuery.ts
    validations:
      required: false

  - type: checkboxes
    id: breaking-changes
    attributes:
      label: Breaking changes
      description: Leave unchecked if behavior is unchanged.
      options:
        - label: Tauri IPC command signature changes
        - label: SQLite migration required
        - label: Settings / persisted state format changes
        - label: Frontend route or store shape changes

  - type: textarea
    id: testing-strategy
    attributes:
      label: Verification plan
      placeholder: |
        - `cargo test --manifest-path src-tauri/Cargo.toml`
        - `pnpm test`
        - Manual smoke test in `pnpm tauri dev`
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - High (blocking other work)
        - Medium (schedule soon)
        - Low (when convenient)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
